apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "simple-agent.fullname" . }}-config
  labels:
    {{- include "simple-agent.labels" . | nindent 4 }}
data:
  AGENT_LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  AGENT_PORT: {{ .Values.service.port | quote }}
  # Must be reachable from INSIDE THE POD, not just from your laptop's
  # browser - see the comment on `llm.baseUrl` in values.yaml.
  AGENT_LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  AGENT_LLM_MODEL: {{ .Values.llm.model | quote }}
  AGENT_LLM_TEMPERATURE: {{ .Values.llm.temperature | quote }}
  AGENT_LLM_MAX_TOKENS: {{ .Values.llm.maxTokens | quote }}
