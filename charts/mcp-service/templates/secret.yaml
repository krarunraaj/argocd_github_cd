{{- if and (not .Values.legacy.existingSecret) .Values.legacy.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-service.secretName" . }}
  labels:
    {{- include "mcp-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.legacy.existingSecretKey }}: {{ .Values.legacy.apiKey | quote }}
{{- end }}
