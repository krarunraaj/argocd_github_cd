apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "banking-web-application.fullname" . }}-config
  labels:
    {{- include "banking-web-application.labels" . | nindent 4 }}
data:
  BANKING_WEB_LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  BANKING_WEB_PORT: {{ .Values.service.port | quote }}
  # Must be reachable from the BROWSER, not just from inside the cluster -
  # see the comment on `legacy.serviceUrl` in values.yaml.
  BANKING_WEB_LEGACY_SERVICE_URL: {{ .Values.legacy.serviceUrl | quote }}
