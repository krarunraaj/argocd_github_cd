{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "legacy-service.serviceAccountName" . }}
  labels:
    {{- include "legacy-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# This pod never calls the Kubernetes API, so it gets no token.
automountServiceAccountToken: false
{{- end }}
