{{- if and (eq .Values.banking.backend "postgres") .Values.postgres.migrations.enabled }}
# Schema migrations run as a Helm hook Job, never from the application process
# (spec section 6.3). If this Job fails the release fails and the previous
# ReplicaSet keeps serving traffic.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "legacy-service.fullname" . }}-migrate
  labels:
    {{- include "legacy-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.postgres.migrations.backoffLimit }}
  template:
    metadata:
      name: {{ include "legacy-service.fullname" . }}-migrate
      labels:
        {{- include "legacy-service.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "legacy-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: alembic
          image: {{ include "legacy-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: LEGACY_BANKING_BACKEND
              value: postgres
            - name: LEGACY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "legacy-service.secretName" . }}
                  key: {{ .Values.postgres.existingSecretKey }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
