# Consolidated agentgateway-proxy Gateway definition.
#
# This becomes the single GitOps source of truth for this Gateway, managed by
# the "day1-gateway" ArgoCD Application (automated + selfHeal). It includes
# every pre-existing listener (ports 8080-8088, added ad hoc across earlier
# sessions) PLUS the six day-1 listeners on 5000-5005 - all in one file,
# so a sync here can never silently drop the listeners this file doesn't
# "own". If you add a new listener by hand with kubectl in the future,
# selfHeal WILL remove it again unless you also add it here.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
  - allowedRoutes:
      namespaces:
        from: All
    name: http
    port: 8080
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    name: mcp-inspector
    port: 8081
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    name: argocd-tls
    port: 8443
    protocol: TLS
    tls:
      mode: Passthrough
  - allowedRoutes:
      namespaces:
        from: All
    name: chatbot-ui
    port: 8082
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    name: integration-service
    port: 8083
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    name: agent-service
    port: 8084
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    name: prometheus
    port: 8085
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    name: langfuse
    port: 8086
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    name: kibana
    port: 8087
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    name: mcp-inspector-proxy
    port: 8088
    protocol: HTTP
  # ─── Day 1 FDE Training projects - port range 5000-5005 ───
  - allowedRoutes:
      namespaces:
        from: All
    name: day1-legacy-service
    port: 5000
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    name: day1-mcp-service
    port: 5001
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    name: day1-banking-web-application
    port: 5002
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    name: day1-simple-agent
    port: 5003
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    name: day1-langgraph-agent
    port: 5004
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    name: day1-rag-ingestion-service
    port: 5005
    protocol: HTTP
