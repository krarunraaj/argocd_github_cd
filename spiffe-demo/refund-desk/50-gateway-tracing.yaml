# The gateway joins the same distributed trace: it continues the router's traceparent, adds its own span (with the
# caller's identity decision) and exports to the OTel collector.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata: {name: tracing, namespace: refund-desk}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: refund-gateway}]
  frontend:
    tracing:
      backendRef: {name: otel-collector, namespace: observability, port: 4317}
      protocol: GRPC
      randomSampling: "true"
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata: {name: edge-tracing, namespace: refund-desk}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: edge-gateway}]
  frontend:
    tracing:
      backendRef: {name: otel-collector, namespace: observability, port: 4317}
      protocol: GRPC
      randomSampling: "true"
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: {name: allow-gateway-policy-to-collector, namespace: observability}
spec:
  from: [{group: agentgateway.dev, kind: AgentgatewayPolicy, namespace: refund-desk}]
  to: [{group: "", kind: Service, name: otel-collector}]
