# The only route to the domain agents, which run in this namespace (see refund-services/): /api/policy -> policy agent, the rest -> refund agent.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: refund-agent, namespace: refund-desk}
spec:
  parentRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: refund-gateway, sectionName: mtls}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /api/policy}}]
      backendRefs: [{group: "", kind: Service, name: policy-agent, port: 8700, weight: 1}]
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{group: "", kind: Service, name: refund-agent, port: 8500, weight: 1}]
