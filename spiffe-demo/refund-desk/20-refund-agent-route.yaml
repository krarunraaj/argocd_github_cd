# The only route to the refund agent, which now runs in this namespace (see refund-services/).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: refund-agent, namespace: refund-desk}
spec:
  parentRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: refund-gateway, sectionName: mtls}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: refund-agent, port: 8500, weight: 1}]
