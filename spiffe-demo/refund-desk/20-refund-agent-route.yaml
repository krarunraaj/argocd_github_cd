# The refund agent runs on the Mac (:8500, next to Ollama). This Service has no selector: its one endpoint is the Mac,
# reached from the cluster as 192.168.5.2 (host.lima.internal).
apiVersion: v1
kind: Service
metadata: {name: refund-agent, namespace: refund-desk}
spec:
  ports: [{port: 8500, targetPort: 8500}]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: refund-agent-mac
  namespace: refund-desk
  labels: {kubernetes.io/service-name: refund-agent}
addressType: IPv4
ports: [{port: 8500}]
endpoints: [{addresses: ["192.168.5.2"]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: refund-agent, namespace: refund-desk}
spec:
  parentRefs: [{name: refund-gateway, sectionName: mtls}]
  rules:
    - backendRefs: [{name: refund-agent, port: 8500}]
