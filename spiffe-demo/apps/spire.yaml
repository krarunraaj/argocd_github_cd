apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spire
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "1"}
  finalizers: [resources-finalizer.argocd.argoproj.io]   # deleting the Application also deletes what it deployed
spec:
  project: default
  source:
    repoURL: https://github.com/krarunraaj/argocd_github_cd.git
    targetRevision: main
    path: spiffe-demo/spire
  destination: {server: https://kubernetes.default.svc, namespace: spire-mgmt}
  ignoreDifferences:   # the API server fills defaults into the volumeClaimTemplates
    - {group: apps, kind: StatefulSet, name: spire-server, jqPathExpressions: ['.spec.volumeClaimTemplates']}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
