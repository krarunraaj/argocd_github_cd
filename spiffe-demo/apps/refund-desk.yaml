apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: refund-desk
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "2"}
  finalizers: [resources-finalizer.argocd.argoproj.io]   # deleting the Application also deletes what it deployed
spec:
  project: default
  source:
    repoURL: https://github.com/krarunraaj/argocd_github_cd.git
    targetRevision: main
    path: spiffe-demo/refund-desk
  destination: {server: https://kubernetes.default.svc, namespace: refund-desk}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
