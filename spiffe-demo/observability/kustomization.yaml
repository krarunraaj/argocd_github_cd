# Argo CD renders this folder with kustomize so the dashboard JSON stays a plain, reviewable file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [00-namespace.yaml, 10-otel-collector.yaml, 20-prometheus.yaml, 30-loki.yaml, 40-promtail.yaml, 50-grafana.yaml]
configMapGenerator:
  - name: grafana-dashboards
    namespace: observability
    files: [dashboards/refund-desk.json]
generatorOptions: {disableNameSuffixHash: true}
