# One door for telemetry. Services and the gateway send OTLP here; the collector
#   - forwards every trace to Langfuse (OTLP, same trace ids as the router's own Langfuse events),
#   - turns spans into RED metrics (calls, errors, latency per service) that Prometheus scrapes.
# The Langfuse credential lives in the Secret `langfuse-otel` (created by scripts/create-secrets.sh, never in Git).
apiVersion: v1
kind: ConfigMap
metadata: {name: otel-collector, namespace: observability}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      memory_limiter: {check_interval: 1s, limit_mib: 300}
      batch: {}
    connectors:
      spanmetrics:
        histogram:
          explicit: {buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 10s, 30s, 60s, 120s, 240s]}
        dimensions: [{name: http.status_code}, {name: http.method}]
    exporters:
      otlphttp/langfuse:
        endpoint: http://192.168.5.2:3002/api/public/otel
        headers:
          Authorization: "Basic ${env:LANGFUSE_BASIC_AUTH}"
          x-langfuse-ingestion-version: "4"
      prometheus: {endpoint: 0.0.0.0:8889}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [spanmetrics, otlphttp/langfuse]
        metrics:
          receivers: [spanmetrics]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector, namespace: observability, labels: {app: otel-collector}}
spec:
  replicas: 1
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector}}
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.116.1
          args: ["--config=/etc/otel/config.yaml"]
          env:
            - name: LANGFUSE_BASIC_AUTH
              valueFrom: {secretKeyRef: {name: langfuse-otel, key: basic-auth}}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8889}
          volumeMounts: [{name: config, mountPath: /etc/otel}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 400Mi}}
      volumes: [{name: config, configMap: {name: otel-collector}}]
---
apiVersion: v1
kind: Service
metadata: {name: otel-collector, namespace: observability}
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: metrics, port: 8889, targetPort: metrics}
