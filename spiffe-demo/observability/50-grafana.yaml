# Grafana: metrics from Prometheus, logs from Loki, one dashboard for the whole refund flow. Traces live in Langfuse.
# Local login admin/admin; anonymous viewers allowed. Change both before this goes anywhere shared.
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-datasources, namespace: observability}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - {name: Prometheus, uid: prometheus, type: prometheus, access: proxy, url: "http://prometheus.observability.svc.cluster.local:9090", isDefault: true}
      - {name: Loki, uid: loki, type: loki, access: proxy, url: "http://loki.observability.svc.cluster.local:3100"}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-dashboard-provider, namespace: observability}
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - {name: refund-desk, folder: Refund desk, type: file, options: {path: /var/lib/grafana/dashboards}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: observability, labels: {app: grafana}}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: admin}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/refund-desk.json}
          ports: [{name: http, containerPort: 3000}]
          readinessProbe: {httpGet: {path: /api/health, port: http}}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
          resources: {requests: {cpu: 50m, memory: 192Mi}, limits: {memory: 512Mi}}
      volumes:
        - {name: datasources, configMap: {name: grafana-datasources}}
        - {name: provider, configMap: {name: grafana-dashboard-provider}}
        - {name: dashboards, configMap: {name: grafana-dashboards}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: observability}
spec:
  selector: {app: grafana}
  ports: [{name: http, port: 3000, targetPort: http}]
