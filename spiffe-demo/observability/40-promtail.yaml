apiVersion: v1
kind: ServiceAccount
metadata: {name: promtail, namespace: observability}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: promtail}
rules:
  - {apiGroups: [""], resources: [pods, nodes], verbs: [get, list, watch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: promtail}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: promtail}
subjects: [{kind: ServiceAccount, name: promtail, namespace: observability}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: promtail, namespace: observability}
data:
  promtail.yaml: |
    server: {http_listen_port: 9080}
    positions: {filename: /run/promtail/positions.yaml}
    clients: [{url: "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"}]
    scrape_configs:
      - job_name: pods
        kubernetes_sd_configs: [{role: pod}]
        pipeline_stages: [{cri: {}}]
        relabel_configs:
          - {source_labels: [__meta_kubernetes_namespace], regex: "refund-desk|observability|spire-mgmt", action: keep}
          - {source_labels: [__meta_kubernetes_namespace], target_label: namespace}
          - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
          - {source_labels: [__meta_kubernetes_pod_container_name], target_label: container}
          - {source_labels: [__meta_kubernetes_pod_label_app], target_label: app}
          - {source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name], separator: /, target_label: __path__, replacement: "/var/log/pods/*$1/*.log"}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: promtail, namespace: observability, labels: {app: promtail}}
spec:
  selector: {matchLabels: {app: promtail}}
  template:
    metadata: {labels: {app: promtail}}
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.3.2
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          securityContext: {runAsUser: 0}
          volumeMounts:
            - {name: config, mountPath: /etc/promtail}
            - {name: positions, mountPath: /run/promtail}
            - {name: pods, mountPath: /var/log/pods, readOnly: true}
            - {name: docker, mountPath: /var/lib/docker/containers, readOnly: true}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {memory: 192Mi}}
      volumes:
        - {name: config, configMap: {name: promtail}}
        - {name: positions, emptyDir: {}}
        - {name: pods, hostPath: {path: /var/log/pods}}
        - {name: docker, hostPath: {path: /var/lib/docker/containers}}
