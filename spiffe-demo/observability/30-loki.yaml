# Loki keeps the logs; Promtail (next file) ships every pod's log into it; Grafana reads it.
apiVersion: v1
kind: ConfigMap
metadata: {name: loki, namespace: observability}
data:
  loki.yaml: |
    auth_enabled: false
    server: {http_listen_port: 3100}
    common:
      path_prefix: /loki
      replication_factor: 1
      ring: {instance_addr: 127.0.0.1, kvstore: {store: inmemory}}
      storage: {filesystem: {chunks_directory: /loki/chunks, rules_directory: /loki/rules}}
    schema_config:
      configs:
        - {from: "2024-01-01", store: tsdb, object_store: filesystem, schema: v13, index: {prefix: index_, period: 24h}}
    limits_config: {allow_structured_metadata: true}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: loki-data, namespace: observability}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loki, namespace: observability, labels: {app: loki}}
spec:
  replicas: 1
  selector: {matchLabels: {app: loki}}
  template:
    metadata: {labels: {app: loki}}
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.3.2
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports: [{name: http, containerPort: 3100}]
          volumeMounts: [{name: config, mountPath: /etc/loki}, {name: data, mountPath: /loki}]
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 15}
          resources: {requests: {cpu: 50m, memory: 192Mi}, limits: {memory: 512Mi}}
      volumes:
        - {name: config, configMap: {name: loki}}
        - {name: data, persistentVolumeClaim: {claimName: loki-data}}
---
apiVersion: v1
kind: Service
metadata: {name: loki, namespace: observability}
spec:
  selector: {app: loki}
  ports: [{name: http, port: 3100, targetPort: http}]
