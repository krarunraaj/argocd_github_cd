apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: day1-mcp-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/krarunraaj/argocd_github_cd.git
    targetRevision: main
    path: charts/mcp-service
    helm:
      releaseName: mcp-service
      valuesObject:
        service:
          type: ClusterIP
        # Pinned to 1 replica: this MCP transport keeps session state
        # in-memory per pod, with no session affinity configured on the
        # Service. With 2+ replicas, `initialize` and a later `tools/list`
        # can land on different pods and the second one replies
        # "Session not found" - exactly what happened before this was
        # pinned down. Fixing this properly (sticky sessions or a shared
        # session store) is out of scope for this training deployment; see
        # this chart's own deploy/README.md troubleshooting table.
        replicaCount: 1
        # legacy.serviceUrl left empty on purpose - the chart derives
        # http://legacy-service.<namespace>.svc.cluster.local:8100 from
        # legacy.legacyReleaseName (defaults to "legacy-service", matching
        # day1-legacy-service.yaml's releaseName) and this Application's own
        # destination namespace.
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
